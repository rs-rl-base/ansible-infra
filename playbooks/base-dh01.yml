---
- name: Bootstrap base-dh01 (static IP, domain join, docker group)
  hosts: all
  become: true
  become_method: sudo
  become_user: root
  gather_facts: true

  vars:
    # --- TARGET ---
    target_hostname: "base-dh01"
    target_ip: "192.168.20.41"
    target_prefix: 24
    target_gw: "192.168.20.254"

    dns_servers:
      - "192.168.6.231"
      - "192.168.20.231"
    dns_search:
      - "corp.base.pl"

    timezone_name: "Europe/Warsaw"

    # --- DOMAIN ---
    domain_fqdn: "corp.base.pl"
    domain_join_user: "rs_rl"                # user do join
    # Podajesz w Semaphore jako Secret Extra Var:
    # ad_join_password: "..."
    ad_join_password: "{{ ad_join_password | default(omit) }}"

    # --- GROUPS (AD) ---
    ssh_allowed_group: "ztc_linuxuser"
    sudo_admin_group: "ztc_linuxadmin"
    docker_manage_group: "ztc_docker"

    # --- NETPLAN ---
    netplan_iface: "eth0"
    netplan_file: "/etc/netplan/00-static.yaml"
    dhcp_netplan_file: "/etc/netplan/00-dhcp.yaml"

  pre_tasks:
    - name: Ensure timezone (important for Kerberos/realm join)
      ansible.builtin.command: "timedatectl set-timezone {{ timezone_name }}"
      changed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install packages for domain join + tools
      ansible.builtin.apt:
        name:
          - realmd
          - sssd
          - sssd-tools
          - adcli
          - oddjob
          - oddjob-mkhomedir
          - samba-common-bin
          - packagekit
          - chrony
          - dnsutils
          - curl
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    - name: Ensure oddjobd is enabled (mkhomedir helper)
      ansible.builtin.service:
        name: oddjobd
        state: started
        enabled: true

  tasks:
    # ----------------------------
    # Hostname
    # ----------------------------
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ target_hostname }}"

    - name: Ensure /etc/hosts has 127.0.1.1 hostname entry
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+'
        line: "127.0.1.1 {{ target_hostname }}"
        create: false

    # ----------------------------
    # Netplan (static) - only if changed
    # ----------------------------
    - name: Write netplan static config
      ansible.builtin.copy:
        dest: "{{ netplan_file }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              {{ netplan_iface }}:
                addresses:
                  - {{ target_ip }}/{{ target_prefix }}
                routes:
                  - to: default
                    via: {{ target_gw }}
                nameservers:
                  addresses:
          {% for d in dns_servers %}
                    - {{ d }}
          {% endfor %}
                  search:
          {% for s in dns_search %}
                    - {{ s }}
          {% endfor %}
      register: netplan_cfg

    - name: Remove DHCP netplan if exists
      ansible.builtin.file:
        path: "{{ dhcp_netplan_file }}"
        state: absent
      register: removed_dhcp

    - name: Apply netplan (may drop SSH) if config changed
      ansible.builtin.command: netplan apply
      async: 60
      poll: 0
      changed_when: true
      when: netplan_cfg.changed or removed_dhcp.changed

    - name: Switch Ansible connection to target IP when netplan changed
      ansible.builtin.set_fact:
        ansible_host: "{{ target_ip }}"
      when: netplan_cfg.changed or removed_dhcp.changed

    - name: Reset connection after IP change
      meta: reset_connection
      when: netplan_cfg.changed or removed_dhcp.changed

    - name: Wait for SSH on target IP (Ansible connection)
      ansible.builtin.wait_for_connection:
        timeout: 600
      when: netplan_cfg.changed or removed_dhcp.changed

    - name: Reboot after network change (only when changed)
      ansible.builtin.reboot:
        reboot_timeout: 600
        pre_reboot_delay: 2
      when: netplan_cfg.changed or removed_dhcp.changed

    - name: Reset connection after reboot
      meta: reset_connection
      when: netplan_cfg.changed or removed_dhcp.changed

    - name: Wait for connection after reboot
      ansible.builtin.wait_for_connection:
        timeout: 600
      when: netplan_cfg.changed or removed_dhcp.changed

    # ----------------------------
    # Domain join (idempotent)
    # ----------------------------
    - name: Discover realm
      ansible.builtin.command: "realm discover {{ domain_fqdn }}"
      changed_when: false

    - name: Check if already joined to domain
      ansible.builtin.command: realm list
      register: realm_list
      changed_when: false
      failed_when: false

    - name: Join domain (only if not joined)
      ansible.builtin.shell: |
        set -euo pipefail
        echo "{{ ad_join_password }}" | realm join "{{ domain_fqdn }}" --user="{{ domain_join_user }}@{{ domain_fqdn }}"
      args:
        executable: /bin/bash
      when: realm_list.stdout is not search(domain_fqdn)
      no_log: true

    # ----------------------------
    # SSSD config (short names + restrict access + sudo)
    # ----------------------------
    - name: Configure SSSD (short names + allow only selected groups)
      ansible.builtin.copy:
        dest: /etc/sssd/sssd.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          [sssd]
          domains = {{ domain_fqdn }}
          config_file_version = 2
          services = nss, pam, sudo

          [domain/{{ domain_fqdn }}]
          id_provider = ad
          ad_domain = {{ domain_fqdn }}
          krb5_realm = {{ domain_fqdn | upper }}
          use_fully_qualified_names = False
          fallback_homedir = /home/%u
          default_shell = /bin/bash

          access_provider = simple
          simple_allow_groups = {{ ssh_allowed_group }},{{ sudo_admin_group }},{{ docker_manage_group }}

          cache_credentials = True
      notify: restart sssd

    - name: Enable mkhomedir in PAM (best effort)
      ansible.builtin.command: pam-auth-update --enable mkhomedir
      changed_when: false
      failed_when: false

    # ----------------------------
    # SSH access control
    # ----------------------------
    - name: Restrict SSH to allowed AD groups
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} ANSIBLE MANAGED (GROUP ACCESS)"
        block: |
          AllowGroups {{ ssh_allowed_group }} {{ sudo_admin_group }} {{ docker_manage_group }}
      notify: restart ssh

    # ----------------------------
    # Sudo for admin group
    # ----------------------------
    - name: Sudo for AD admin group
      ansible.builtin.copy:
        dest: /etc/sudoers.d/010-ztc-linuxadmin
        owner: root
        group: root
        mode: "0440"
        content: |
          %{{ sudo_admin_group }} ALL=(ALL) ALL

    # ----------------------------
    # Docker install (Docker official repo)
    # ----------------------------
    - name: Add Docker GPG key (once)
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repo
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
        state: present
      register: docker_repo

    - name: Install Docker Engine + compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: "{{ docker_repo.changed }}"

    - name: Enable and start docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # --- Docker "bez sudo" dla ztc_docker ---
    # Jeśli grupa AD jest widoczna jako unix group -> ustawiamy docker.socket SocketGroup=ztc_docker
    - name: Check if docker AD group exists as unix group
      ansible.builtin.command: "getent group {{ docker_manage_group }}"
      register: getent_docker_group
      changed_when: false
      failed_when: false

    - name: Configure docker.socket to use group ztc_docker (no sudo needed)
      when: getent_docker_group.rc == 0
      block:
        - name: Create systemd override dir for docker.socket
          ansible.builtin.file:
            path: /etc/systemd/system/docker.socket.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Set SocketGroup for docker.socket
          ansible.builtin.copy:
            dest: /etc/systemd/system/docker.socket.d/override.conf
            owner: root
            group: root
            mode: "0644"
            content: |
              [Socket]
              SocketGroup={{ docker_manage_group }}
              SocketMode=0660

        - name: Reload systemd
          ansible.builtin.command: systemctl daemon-reload
          changed_when: true

        - name: Restart docker.socket and docker
          ansible.builtin.service:
            name: docker.socket
            state: restarted
            enabled: true

        - name: Restart docker service
          ansible.builtin.service:
            name: docker
            state: restarted
            enabled: true

    # Fallback (gdy AD group nie mapuje się jako unix group):
    # dajemy NOPASSWD tylko na docker, żeby spełnić "bez hasła" (ale to nadal sudo).
    - name: Fallback sudoers for ztc_docker to manage docker without password
      when: getent_docker_group.rc != 0
      ansible.builtin.copy:
        dest: /etc/sudoers.d/020-ztc-docker
        owner: root
        group: root
        mode: "0440"
        content: |
          %{{ docker_manage_group }} ALL=(root) NOPASSWD: /usr/bin/docker, /usr/bin/docker\ *

  handlers:
    - name: restart sssd
      ansible.builtin.service:
        name: sssd
        state: restarted

    - name: restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: restart docker
      ansible.builtin.service:
        name: docker
        state: restarted